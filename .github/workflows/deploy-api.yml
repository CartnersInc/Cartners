name: Deploy Cartners API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests/test_households.py tests/test_backend_foundation.py -q
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Add GitHub Actions secret RENDER_DEPLOY_HOOK_URL from the cartners-api Settings → Deploy Hook."
            echo "If this service was created from a public Git URL, auto-deploy cannot run; the hook is the authorized trigger."
            exit 1
          fi
          curl -fsS "$HOOK"
      - name: Wait until POST /api/households exists
        run: |
          for i in $(seq 1 36); do
            health=$(curl -sS https://cartners-api.onrender.com/api/health || true)
            echo "$health"
            if echo "$health" | grep -q '"households": true'; then
              code=$(curl -sS -o /tmp/households.json -w '%{http_code}' -X POST https://cartners-api.onrender.com/api/households -H 'Content-Type: application/json' -d '{}')
              echo "households POST status $code"
              test "$code" != "404"
              exit 0
            fi
            sleep 10
          done
          echo "Render did not serve the household routes after waiting. Check the cartners-api deploy logs."
          exit 1
